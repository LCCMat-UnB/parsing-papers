[project]
name = "parsing-papers"
version = "0.1.0"
description = "Pipeline de extracao de metadados de papers cientificos (meta-analise de credito agricola) via GROBID + LLM com verificacao"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "lxml>=5.2.0",
    "litellm>=1.44.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "click>=8.1.7",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
# Comando instalavel novo (`parsing-papers`, sem argumentos = menu
# interativo). `python -m parsing_papers.pipeline <comando>` continua
# funcionando igual antes -- este entry point so adiciona um caminho de
# entrada mais amigavel, nao substitui o existente.
parsing-papers = "parsing_papers.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
